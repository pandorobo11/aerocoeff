[project]
name = "aerocoeff"
version = "0.1.0"
description = "A Python package for aerodynamic coefficient transformations."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["aerodynamics", "coefficients", "reference-frame", "aircraft"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/pandorobo11/aerocoeff"
Repository = "https://github.com/pandorobo11/aerocoeff"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
